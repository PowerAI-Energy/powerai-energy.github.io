name: Actualizar indicadores técnicos y petróleo
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_engineering_data.py
      - requirements-feeds.txt
      - .github/workflows/engineering-data.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: engineering-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de archivos EIA
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-feeds.txt
      - name: Consultar fuentes públicas
        run: python scripts/update_engineering_data.py
      - name: Publicar actualización de datos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/engineering-data.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Actualizar snapshot de datos técnicos públicos'
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Actualizar Cloudflare Pages sin exceder el plan gratuito
        if: github.event_name != 'push'
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # El colector sigue siendo horario. Pages Free admite 500 builds/mes.
          # Solo los horarios pares UTC avisan a Cloudflare (hasta 372/mes).
          if [ "$EVENT_NAME" = "schedule" ] && [ $((10#$(date -u +%H) % 2)) -ne 0 ]; then
            echo "Cloudflare se actualizará en el siguiente turno de dos horas."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_PAGES_DEPLOY_HOOK" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_PAGES_DEPLOY_HOOK."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 --output /dev/null \
            --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
          echo "Cloudflare Pages aceptó la solicitud de despliegue de main."
